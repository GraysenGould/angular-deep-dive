<div *ngFor="let pair of courses |keyvalue">
    {{pair.key + " " + pair.value | json}}
</div>

<div class="courses">

    @for (course of courses | slice: 0: 2; track course.id; let index = $index; let count =$count;
    let first = $first; let last = $last; let even = $even; let odd = $odd;) {
        
        <course-card 
        (courseSelected)="onCourseSelected($event)" 
        [course]="course"
        [class.is-first]="first"
        [class.is-last]="last"
        [index]="index"/>
    }
    @empty {
        <h1>No Courses Found</h1>
    }


</div>
